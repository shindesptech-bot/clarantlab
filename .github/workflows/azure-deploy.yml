# Builds the Next.js app in GitHub Actions (where memory is ample) and deploys
# the prebuilt `standalone` artifact to Azure App Service. Azure/Oryx does NOT
# build — it only runs the already-compiled server. This removes the constrained
# Oryx build box (the cause of the silent OOM during "Running TypeScript ...").
#
# ONE-TIME SETUP (see the report at the end of the change):
#   1. Set repo secret AZURE_WEBAPP_PUBLISH_PROFILE (App Service > Get publish profile).
#   2. Set AZURE_WEBAPP_NAME below to your App Service name.
#   3. On the App Service, set app settings:
#        ENABLE_ORYX_BUILD=false
#        SCM_DO_BUILD_DURING_DEPLOYMENT=false
#        WEBSITES_PORT=3000        (or set PORT; standalone reads PORT)
#        HOSTNAME=0.0.0.0
#      and startup command: node server.js

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: CHANGE_ME_APP_NAME
  NODE_VERSION: "24"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postbuild (copy-standalone-assets.mjs) runs automatically after build and
      # copies `.next/static` and `public` into `.next/standalone`.
      - name: Build (standalone)
        run: npm run build
        env:
          # Headroom so CI never OOMs on the type-check pass. CI runners have 7GB+.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify standalone artifact
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          echo "standalone artifact OK"

      # Deploys the CONTENTS of .next/standalone as the app root, so server.js is
      # at wwwroot and static/public sit beside it exactly as standalone expects.
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .next/standalone
