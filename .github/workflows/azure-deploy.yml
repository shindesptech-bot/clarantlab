# Builds the Next.js app in GitHub Actions (ample memory) and deploys the
# prebuilt `.next` output to Azure App Service, which runs it with
# `next start -p $PORT`. Azure/Oryx does NOT build — this keeps the memory-heavy
# TypeScript type-check off the constrained App Service box (the cause of the
# silent build OOM). Mirrors the working PublicSite deployment model.
#
# ONE-TIME SETUP:
#   1. Repo secret  AZURE_WEBAPP_PUBLISH_PROFILE  (App Service > Get publish profile).
#   2. Repo variable AZURE_WEBAPP_NAME            (your App Service name).
#   3. On the App Service > Settings > Environment variables:
#        ENABLE_ORYX_BUILD=false
#        SCM_DO_BUILD_DURING_DEPLOYMENT=false
#        AUTH_SECRET, MONGODB_URI, CLOUDINARY_*        (runtime env)
#        NEXT_PUBLIC_SITE_URL=https://<app>.azurewebsites.net
#      Startup Command:  npm start        (runs `next start -p $PORT`)

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # CI-only headroom for Next's TypeScript type-check pass. Runners have
          # 7GB+; this is not a production flag and does not disable any check.
          NODE_OPTIONS: --max-old-space-size=4096

      # Drop dev-only deps from the deployed artifact; `next` is a prod dep so
      # `next start` still works at runtime.
      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Verify build artifact
        run: |
          test -d .next
          test -f .next/BUILD_ID
          test -x node_modules/.bin/next
          echo "build artifact OK"

      # Deploys the app (.next + public + node_modules + package.json + config).
      # Azure runs `npm start` -> `next start -p $PORT`.
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
